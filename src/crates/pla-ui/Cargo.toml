[package]
name = "pla-ui"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "pla-ui"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
pla-bridge = { path = "../pla-bridge" }
tokio = { workspace = true }
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
