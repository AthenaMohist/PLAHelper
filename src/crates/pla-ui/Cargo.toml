[package]
name = "pla-ui"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "pla-ui"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
pla-bridge = { path = "../pla-bridge" }
tokio = { workspace = true }
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }

# Win32: 吸附 Plasticity 主窗口(窗口枚举/矩形/进程映像名/进程创建时间);
# Graphics_Gdi: SetWindowRgn/CreateRoundRectRgn 圆角裁剪(R5) + GetDIBits 标题栏探测(R6);
# Storage_Xps: windows-0.52 把 PrintWindow 归到了这个目录(R6 标题栏探测);
# UI_Shell + System_Com: 手动快照文档定位 — SHGetKnownFolderPath(重定向感知) +
#   Recent *.plasticity.lnk 经 IShellLinkW/IPersistFile 解析出完整路径(R7-3);
# Storage_FileSystem: IShellLinkW::GetPath 的 WIN32_FIND_DATAW 参数类型所在 feature。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
] }
