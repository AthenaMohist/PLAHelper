[workspace]
members = [
    "crates/pla-app",
    "crates/pla-bridge",
    "crates/pla-core",
    "crates/pla-dim",
    "crates/pla-selection",
    "crates/pla-snapshot",
    "crates/pla-ui",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"

[profile.release]
lto = true
